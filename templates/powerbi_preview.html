<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Power BI Dashboard Preview</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.jpg') }}" type="image/jpeg">

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background: url('/static/images/future.jpg') no-repeat center center fixed;
            background-size: cover;
            color:#f8fafc;
            min-height:100vh;
            overflow-x:hidden;
        }

        .sidebar{
            width:240px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;
            background: rgba(15,23,42,0.58);
            border-right: 1px solid rgba(255,255,255,0.12);
            border-radius: 0 32px 32px 0;
            backdrop-filter: blur(24px);
            padding:32px 24px;
            box-shadow: 20px 0 80px rgba(0,0,0,0.18);
        }

        .logo{
            font-size:1.55rem;
            font-weight:700;
            color:#ffffff;
            margin-bottom:42px;
            letter-spacing:0.02em;
        }

        .sidebar a{
            display:flex;
            align-items:center;
            color:#cbd5e1;
            text-decoration:none;
            padding:14px 18px;
            border-radius:18px;
            margin-bottom:10px;
            transition:0.2s ease;
            font-size:0.96rem;
            letter-spacing:0.01em;
        }

        .sidebar a .nav-icon{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:30px;
            height:30px;
            margin-right:12px;
            border-radius:12px;
            background: rgba(255,255,255,0.05);
            color:#94a3b8;
            transition:0.2s ease;
        }

        .sidebar a:hover .nav-icon,
        .sidebar a.active .nav-icon{
            background: rgba(56,189,248,0.18);
            color:#38bdf8;
        }

        .sidebar a:hover,
        .sidebar a.active{
            background: linear-gradient(135deg, rgba(56,189,248,0.22), rgba(147,51,234,0.17));
            color:#ffffff;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        .main{
            margin-left:260px;
            padding:30px;
            min-height:100vh;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            flex-wrap:wrap;
            gap:18px;
            margin-bottom:30px;
            background: rgba(15,23,42,0.40);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:28px;
            padding:24px 28px;
            backdrop-filter: blur(24px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.16);
        }

        .topbar-meta{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:16px;
        }

        .meta-pill{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 14px;
            border-radius:999px;
            background: rgba(255,255,255,0.08);
            color:#e2e8f0;
            border:1px solid rgba(255,255,255,0.12);
            font-size:0.85rem;
        }

        .meta-pill i{
            font-size:0.95rem;
        }

        .meta-pill.live{
            color:#38bdf8;
            border-color: rgba(56,189,248,0.28);
            background: rgba(56,189,248,0.12);
        }

        .meta-pill.status{
            color:#22c55e;
            border-color: rgba(34,197,94,0.24);
            background: rgba(34,197,94,0.10);
        }

        .profile{
            background: rgba(255,255,255,0.12);
            padding:12px 20px;
            border-radius:20px;
            border:1px solid rgba(255,255,255,0.16);
            color:#f8fafc;
        }

        .dashboard-box{
            background: rgba(255,255,255,0.14);
            border-radius:24px;
            padding:24px;
            border:1px solid rgba(255,255,255,0.18);
            box-shadow: 0 18px 50px rgba(0,0,0,0.16);
            margin-bottom:1.5rem;
            backdrop-filter: blur(20px);
        }

        .dashboard-box-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            margin-bottom:20px;
        }

        .dashboard-box-header h3{
            margin-bottom:0;
            font-size:1.6rem;
        }

        .dashboard-box p{
            margin-bottom:0;
            color:#cbd5e1;
        }

        .img-fluid{
            max-width:100%;
            height:auto;
            border-radius:24px;
            border:1px solid rgba(255,255,255,0.16);
        }
    </style>

</head>

<body>

    <div class="sidebar">

        <div class="logo">
            Logistics AI
        </div>

        <a href="/dashboard">
            <span class="nav-icon"><i class="bi bi-grid-fill"></i></span>
            Dashboard
        </a>

        <a href="/powerbi-preview" class="active">
            <span class="nav-icon"><i class="bi bi-bar-chart-line-fill"></i></span>
            Power BI Preview
        </a>

        <a href="/compare-scenarios">
            <span class="nav-icon"><i class="bi bi-activity"></i></span>
            Comparative Scenarios
        </a>

        <a href="/">
            <span class="nav-icon"><i class="bi bi-arrow-left-circle-fill"></i></span>
            Back Home
        </a>

    </div>

    <div class="main">

        <div class="topbar">

            <div>

                <h2 class="fw-bold">
                    📊 Power BI Dashboard Preview
                </h2>

                <p class="text-secondary">
                    Visual preview of your Power BI dashboard image.
                </p>

                <div class="topbar-meta">
                    <span class="meta-pill live">
                        <i class="bi bi-lightning-charge-fill"></i>
                        Live preview
                    </span>
                    <span class="meta-pill status">
                        <i class="bi bi-shield-check"></i>
                        Ready to present
                    </span>
                    <span class="meta-pill">
                        <i class="bi bi-clock-history"></i>
                        Updated 3 min ago
                    </span>
                </div>

            </div>

            <div class="profile">

                <i class="bi bi-person-circle"></i>
                Admin

            </div>

        </div>

        <div class="dashboard-box">
            <div class="dashboard-box-header">
                <div>
                    <h3>Power BI Dashboard</h3>
                    <p>Preview image from your Power BI design.</p>
                </div>
            </div>
            <div class="text-center">
                <img src="{{ url_for('static', filename='images/BI.png') }}" alt="Power BI dashboard preview" class="img-fluid" />
            </div>
        </div>

    </div>

</body>

</html>

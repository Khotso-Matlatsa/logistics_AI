<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta name="viewport"
		  content="width=device-width, initial-scale=1.0">

	<title>
		AI Logistics Results
	</title>
	<link rel="icon" href="{{ url_for('static', filename='images/logo.jpg') }}" type="image/jpeg">

	<!-- Bootstrap -->

	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
	>

	<!-- Bootstrap Icons -->

	<link
		rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	>

	<!-- Google Font -->

	<link
		href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
		rel="stylesheet"
	>

	<style>

		*{
			margin:0;
			padding:0;
			box-sizing:border-box;
			font-family:'Poppins', sans-serif;
		}

		body{
			background: url('/static/images/future.jpg') no-repeat center center fixed;
			background-size: cover;
			color:white;
			min-height:100vh;
			overflow-x:hidden;
		}

		.main-container{
			padding:40px;
		}

		.dashboard-card,
		.result-card,
		.chart-card,
		.ai-box,
		.empty-state{
			background: rgba(255,255,255,0.14);
			border-radius:28px;
			padding:24px;
			border:1px solid rgba(255,255,255,0.18);
			transition:0.3s ease;
			backdrop-filter: blur(22px);
			box-shadow: 0 24px 60px rgba(0,0,0,0.16);
		}

		.dashboard-card:hover{
			transform:translateY(-6px);
			border-color: rgba(56,189,248,0.35);
		}

		.metric-value{
			font-size:2rem;
			font-weight:700;
			color:#38bdf8;
		}

		.metric-label{
			color:#cbd5e1;
			margin-top:8px;
		}

		.table{
			border-radius:24px;
			overflow:hidden;
			background: rgba(255,255,255,0.12);
			border:1px solid rgba(255,255,255,0.16);
			backdrop-filter: blur(20px);
		}

	</style>

</head>

<body>

<div class="container-fluid main-container">

	<div class="d-flex justify-content-between align-items-center mb-4">

		<div>

			<h1 class="fw-bold">Results</h1>

			<p class="text-secondary">Model predictions and scenario outcomes</p>

		</div>

		<a href="/dashboard" class="btn btn-outline-info">
			<i class="bi bi-arrow-left-circle-fill"></i>
			Back Dashboard
		</a>

	</div>

	<div class="row g-4 mb-4">

		<div class="col-md-4">
			<div class="dashboard-card text-center">
				<i class="bi bi-graph-up-arrow fs-1 text-success"></i>
				<div class="metric-value">${{ result.predicted_sales if result }}</div>
				<div class="metric-label">Predicted Sales</div>
			</div>
		</div>

		<div class="col-md-4">
			<div class="dashboard-card text-center">
				<i class="bi bi-cash-stack fs-1 text-info"></i>
				<div class="metric-value">${{ result.predicted_profit if result }}</div>
				<div class="metric-label">Predicted Profit</div>
			</div>
		</div>

		<div class="col-md-4">
			<div class="dashboard-card text-center">
				<i class="bi bi-exclamation-triangle fs-1 text-warning"></i>
				<div class="metric-value">{{ result.risk_probability if result }}%</div>
				<div class="metric-label">Risk Probability</div>
			</div>
		</div>

	</div>

	<div class="chart-card">
		<h5 class="fw-bold">Prediction Summary</h5>
		<p class="text-secondary">Detailed results and charts appear here.</p>
	</div>

</div>

</body>

</html>

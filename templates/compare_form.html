<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparative Scenario Analysis</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.jpg') }}" type="image/jpeg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background: url('/static/images/future.jpg') no-repeat center center fixed;
            background-size: cover;
            color:white;
            min-height:100vh;
        }

        .container-custom{
            padding:40px;
            max-width:1200px;
            margin:auto;
        }

        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
        }

        .page-header h1{
            font-size:2.25rem;
            margin-bottom:8px;
        }

        .page-header p{
            color:#cbd5e1;
        }

        .card-glow{
            background: rgba(255,255,255,0.14);
            border:1px solid rgba(255,255,255,0.18);
            border-radius:24px;
            padding:28px;
            backdrop-filter: blur(22px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.16);
        }

        .card-glow h4{
            font-weight:700;
            margin-bottom:22px;
        }

        .form-label{
            color:#e2e8f0;
            font-weight:600;
            margin-bottom:8px;
            display:block;
        }

        .form-control,
        .form-select{
            background: rgba(255,255,255,0.14);
            border:none;
            color:white;
            padding:14px;
            border-radius:16px;
            border:1px solid rgba(255,255,255,0.16);
        }

        .form-control::placeholder,
        .form-select option{
            color: rgba(255,255,255,0.7);
        }

        .btn-submit{
            background:#38bdf8;
            border:none;
            color:#fff;
            padding:14px 24px;
            border-radius:18px;
            font-weight:700;
            box-shadow: 0 18px 40px rgba(56,189,248,0.24);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover{
            transform:translateY(-2px);
            box-shadow: 0 24px 46px rgba(56,189,248,0.28);
        }

        .alert-custom{
            border-radius:20px;
            border:1px solid rgba(248,113,113,0.22);
            background: rgba(248,113,113,0.10);
            color:#fee2e2;
        }

        @media(max-width:991px){
            .page-header{
                flex-direction:column;
                gap:18px;
                text-align:center;
            }
        }
    </style>

</head>

<body>

    <div class="container-custom">

        <div class="page-header">

            <div>
                <h1>Comparative Scenario Analysis</h1>
                <p>Enter multiple logistics scenarios and compare AI predictions side-by-side.</p>
            </div>

            <div>
                <a href="/dashboard" class="btn btn-outline-info">
                    <i class="bi bi-arrow-left-circle-fill"></i>
                    Back to Dashboard
                </a>
            </div>

        </div>

        {% if error %}
        <div class="alert alert-danger alert-custom mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form action="/compare-scenarios" method="POST">

            <div class="row g-4">

                <div class="col-md-4">

                    <div class="card-glow">
                        <h4>Scenario 1</h4>
                        <label class="form-label">Shipping Days</label>
                        <input type="number" step="0.01" name="distance_1" class="form-control" required>

                        <label class="form-label mt-3">Order Quantity</label>
                        <input type="number" name="orders_1" class="form-control" required>

                        <label class="form-label mt-3">Product Price</label>
                        <input type="number" step="0.01" name="product_price_1" class="form-control" required>

                        <label class="form-label mt-3">Shipping Mode</label>
                        <select name="shipping_mode_1" class="form-select">
                            <option>Air</option>
                            <option>Road</option>
                            <option>Rail</option>
                        </select>

                        <label class="form-label mt-3">Customer Segment</label>
                        <select name="customer_segment_1" class="form-select">
                            <option>Consumer</option>
                            <option>Corporate</option>
                            <option>Home Office</option>
                        </select>

                        <label class="form-label mt-3">Market</label>
                        <select name="market_1" class="form-select">
                            <option>Africa</option>
                            <option>Europe</option>
                            <option>US</option>
                            <option>Asia Pacific</option>
                        </select>

                        <label class="form-label mt-3">Order City</label>
                        <select name="order_city_1" class="form-select">
                            <option>Johannesburg</option>
                            <option>Cape Town</option>
                            <option>Durban</option>
                            <option>Pretoria</option>
                        </select>

                        <label class="form-label mt-3">Category Name</label>
                        <select name="category_name_1" class="form-select">
                            <option>Technology</option>
                            <option>Furniture</option>
                            <option>Office Supplies</option>
                        </select>
                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card-glow">
                        <h4>Scenario 2</h4>
                        <label class="form-label">Shipping Days</label>
                        <input type="number" step="0.01" name="distance_2" class="form-control" required>

                        <label class="form-label mt-3">Order Quantity</label>
                        <input type="number" name="orders_2" class="form-control" required>

                        <label class="form-label mt-3">Product Price</label>
                        <input type="number" step="0.01" name="product_price_2" class="form-control" required>

                        <label class="form-label mt-3">Shipping Mode</label>
                        <select name="shipping_mode_2" class="form-select">
                            <option>Air</option>
                            <option>Road</option>
                            <option>Rail</option>
                        </select>

                        <label class="form-label mt-3">Customer Segment</label>
                        <select name="customer_segment_2" class="form-select">
                            <option>Consumer</option>
                            <option>Corporate</option>
                            <option>Home Office</option>
                        </select>

                        <label class="form-label mt-3">Market</label>
                        <select name="market_2" class="form-select">
                            <option>Africa</option>
                            <option>Europe</option>
                            <option>US</option>
                            <option>Asia Pacific</option>
                        </select>

                        <label class="form-label mt-3">Order City</label>
                        <select name="order_city_2" class="form-select">
                            <option>Johannesburg</option>
                            <option>Cape Town</option>
                            <option>Durban</option>
                            <option>Pretoria</option>
                        </select>

                        <label class="form-label mt-3">Category Name</label>
                        <select name="category_name_2" class="form-select">
                            <option>Technology</option>
                            <option>Furniture</option>
                            <option>Office Supplies</option>
                        </select>
                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card-glow">
                        <h4>Scenario 3</h4>
                        <label class="form-label">Shipping Days</label>
                        <input type="number" step="0.01" name="distance_3" class="form-control" required>

                        <label class="form-label mt-3">Order Quantity</label>
                        <input type="number" name="orders_3" class="form-control" required>

                        <label class="form-label mt-3">Product Price</label>
                        <input type="number" step="0.01" name="product_price_3" class="form-control" required>

                        <label class="form-label mt-3">Shipping Mode</label>
                        <select name="shipping_mode_3" class="form-select">
                            <option>Air</option>
                            <option>Road</option>
                            <option>Rail</option>
                        </select>

                        <label class="form-label mt-3">Customer Segment</label>
                        <select name="customer_segment_3" class="form-select">
                            <option>Consumer</option>
                            <option>Corporate</option>
                            <option>Home Office</option>
                        </select>

                        <label class="form-label mt-3">Market</label>
                        <select name="market_3" class="form-select">
                            <option>Africa</option>
                            <option>Europe</option>
                            <option>US</option>
                            <option>Asia Pacific</option>
                        </select>

                        <label class="form-label mt-3">Order City</label>
                        <select name="order_city_3" class="form-select">
                            <option>Johannesburg</option>
                            <option>Cape Town</option>
                            <option>Durban</option>
                            <option>Pretoria</option>
                        </select>

                        <label class="form-label mt-3">Category Name</label>
                        <select name="category_name_3" class="form-select">
                            <option>Technology</option>
                            <option>Furniture</option>
                            <option>Office Supplies</option>
                        </select>
                    </div>

                </div>

            </div>

            <div class="text-center mt-4">
                <button class="btn-submit" type="submit">
                    <i class="bi bi-graph-up-arrow"></i>
                    Compare Scenarios
                </button>
            </div>

        </form>

    </div>

</body>
</html>
